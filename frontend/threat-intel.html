<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threat Intel - MalScope</title>
    <script src="assets/vendor/tailwind.js"></script>
    <script src="assets/vendor/sweetalert2.js"></script>
    <script src="assets/vendor/lucide.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="flex bg-slate-900 text-slate-50 overflow-hidden">
    
    <div id="sidebar-container"></div>

    <main class="flex-1 ml-64 h-screen flex flex-col overflow-hidden">
        <header class="bg-slate-800 border-b border-slate-700 py-4 px-8 flex justify-between items-center z-10">
            <h2 class="text-xl font-semibold">Threat Intelligence</h2>
        </header>

        <div class="p-8 flex-1 overflow-y-auto">
            <div class="max-w-4xl mx-auto space-y-6">
                <!-- Search Box -->
                <div class="card p-6">
                    <h3 class="font-medium text-slate-300 mb-4">Search Threat Indicators</h3>
                    <form id="threatSearchForm" class="flex gap-4">
                        <select id="indicatorType" class="px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-sm">
                            <option value="hash">File Hash (MD5/SHA)</option>
                            <option value="ip">IP Address</option>
                            <option value="domain">Domain Name</option>
                        </select>
                        <input type="text" id="indicatorValue" required class="flex-1 px-4 py-2 rounded-lg bg-slate-900 border border-slate-700 text-sm font-mono placeholder-slate-500" placeholder="Enter indicator...">
                        <button type="submit" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-medium transition-colors">
                            Lookup
                        </button>
                    </form>
                </div>

                <!-- Results Area -->
                <div id="resultsContainer" class="card p-6 hidden">
                    <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                        <h3 class="font-medium text-slate-300 text-lg">Intelligence Report</h3>
                        <span id="threatScore" class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider"></span>
                    </div>

                    <div id="resultsContent" class="space-y-4 text-sm text-slate-300">
                        <!-- Populated dynamically -->
                    </div>
                </div>

            </div>
        </div>
    </main>
    
    <script type="module" src="assets/js/threat-intel.js"></script>
</body>
</html>
