<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MalScope</title>
    <!-- Local Vendor Assets -->
    <script src="assets/vendor/tailwind.js"></script>
    <script src="assets/vendor/sweetalert2.js"></script>
    <script src="assets/vendor/lucide.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="h-screen w-screen flex items-center justify-center bg-slate-900">
    
    <div class="card w-full max-w-md p-8 shadow-2xl">
        <div class="flex flex-col items-center mb-8">
            <i data-lucide="shield-alert" class="text-emerald-500 w-12 h-12 mb-4"></i>
            <h1 class="text-2xl font-bold tracking-widest text-slate-50 uppercase">MalScope</h1>
            <p class="text-slate-400 text-sm mt-2">Malware Analysis Platform</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Username</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="user" class="w-4 h-4 text-slate-400"></i>
                    </div>
                    <input type="text" id="username" required class="block w-full pl-10 pr-3 py-2.5 rounded-lg text-sm placeholder-slate-500" placeholder="admin">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="lock" class="w-4 h-4 text-slate-400"></i>
                    </div>
                    <input type="password" id="password" required class="block w-full pl-10 pr-3 py-2.5 rounded-lg text-sm placeholder-slate-500" placeholder="••••••••">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 focus:ring-offset-slate-900 transition-colors">
                Authenticate
            </button>
        </form>
        
        <div class="mt-6 text-center text-xs text-slate-500">
            Isolated Environment Ready
        </div>
    </div>

    <script type="module" src="assets/js/auth.js"></script>
</body>
</html>
