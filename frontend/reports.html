<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - MalScope</title>
    <script src="assets/vendor/tailwind.js"></script>
    <script src="assets/vendor/sweetalert2.js"></script>
    <script src="assets/vendor/lucide.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="flex bg-slate-900 text-slate-50 overflow-hidden">
    
    <div id="sidebar-container"></div>

    <main class="flex-1 ml-64 h-screen flex flex-col overflow-hidden">
        <header class="bg-slate-800 border-b border-slate-700 py-4 px-8 flex justify-between items-center z-10">
            <h2 class="text-xl font-semibold">Analysis Reports</h2>
        </header>

        <div class="p-8 flex-1 overflow-y-auto">
            <div class="card p-0 flex flex-col h-full max-h-[800px]">
                
                <!-- Table -->
                <div class="flex-1 overflow-auto">
                    <table class="w-full text-sm text-left whitespace-nowrap">
                        <thead class="text-xs text-slate-400 uppercase bg-slate-800/80 sticky top-0">
                            <tr>
                                <th class="px-6 py-4">Sample Hash</th>
                                <th class="px-6 py-4">Date Analyzed</th>
                                <th class="px-6 py-4">Threat Level</th>
                                <th class="px-6 py-4 text-right">Export Report</th>
                            </tr>
                        </thead>
                        <tbody id="reportsTable" class="divide-y divide-slate-700/50">
                            <tr><td colspan="4" class="px-6 py-8 text-center text-slate-500">Loading reports...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="assets/js/reports.js"></script>
</body>
</html>
